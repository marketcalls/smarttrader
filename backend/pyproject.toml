[project]
name = "smarttrader-backend"
version = "0.1.0"
description = "SmartTrader backend: FastAPI and SQLite for TradeSmart Online"
authors = [
    { name = "rajandran", email = "rajandran@marketcalls.in" }
]
requires-python = ">=3.14"
dependencies = [
    "agno>=3.1.2",
    "cryptography>=50.0.2",
    "fastapi==0.143.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "litellm>=1.104.2",
    "sqlalchemy>=2,<3",
    "tzdata>=2026.5",
    "uvicorn[standard]==0.54.0",
    "websockets>=17.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
